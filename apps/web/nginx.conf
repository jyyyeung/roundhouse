server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, do not append: the API trusts this header when TRUST_PROXY is
    # set, so an appended client-supplied value would let the client pick its own
    # rate-limit bucket.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://server:3001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    # Overwrite, do not append: the API trusts this header when TRUST_PROXY is
    # set, so an appended client-supplied value would let the client pick its own
    # rate-limit bucket.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
  }

  # Health and readiness are answered by the API, but operators should be able
  # to monitor them on the public port (and through a TLS proxy in front of it)
  # without exposing :3001. See docs/self-hosting.md.
  location = /health {
    proxy_pass http://server:3001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location = /ready {
    proxy_pass http://server:3001/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
