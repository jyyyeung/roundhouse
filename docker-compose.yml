services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roundhouse}
      POSTGRES_USER: ${POSTGRES_USER:-roundhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roundhouse}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://roundhouse:roundhouse@db:5432/roundhouse}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-32+char-secret-value}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      PORT: ${PORT:-3001}
    ports:
      - "${SERVER_PORT:-3001}:3001"
    healthcheck:
      # /ready, not /health: `web` must not serve a page whose API cannot reach
      # Postgres, so the dependency is readiness, not process liveness.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
