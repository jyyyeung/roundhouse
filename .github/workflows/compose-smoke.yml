name: compose-smoke

# Builds the two Docker images and runs the packaged stack. Nothing else in CI
# touches the Dockerfiles or nginx.conf, so a broken image would otherwise only
# surface on a self-hoster's machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No pnpm here: nothing is installed on the runner. Left on, the
          # default package-manager cache fails the post-run step for lack of a
          # store to save.
          package-manager-cache: false

      # Parse the TLS samples the self-hosting docs ship (#47). Docker is
      # already here, which is why this lives in this job and not in contracts.
      - name: Validate deploy samples
        run: ./scripts/check-deploy-samples.sh

      # The script only needs Node's fetch for the waiters and the end-to-end
      # assertions; the application itself runs inside the images.
      - name: Run the packaged stack
        run: ./scripts/compose-smoke.sh
