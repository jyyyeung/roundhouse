name: integration

# The unit suites fake the database, so they cannot fail on a lock order, a
# unique-constraint race, or a jsonb round trip. This job runs
# apps/server/src/room/runtime.integration.test.ts against a real postgres:16,
# which is the only place those failure modes are actually exercised.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roundhouse_test
          POSTGRES_PASSWORD: roundhouse
          POSTGRES_USER: roundhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roundhouse -d roundhouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only the *_test database is configured: the suite refuses to run unless
      # the name ends in _test, because it truncates every table between tests.
      DATABASE_URL_TEST: postgres://roundhouse:roundhouse@localhost:5432/roundhouse_test
      # Any 32+ character value: this stack is thrown away after the run.
      BETTER_AUTH_SECRET: ci-integration-secret-0123456789abcdef0123
      BETTER_AUTH_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration suite
        # Every `*.integration.test.ts`: runtime, auth limits and the intent budget.
        run: pnpm --filter @roundhouse/server exec vitest run integration --config vitest.integration.config.ts
