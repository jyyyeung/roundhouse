name: contracts

# Guards that read the tree without running it.
#
# Invariant I1: only `projectStateFor` output crosses the wire, from one seam.
# The unit tests prove the projection strips hidden fields; this job proves that
# no future code path can bypass the seam in the first place.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node@v5 caches the package manager's store by default, which
          # needs pnpm installed. This job has no install step on purpose.
          package-manager-cache: false

      # No install step: both guards read source files, neither runs the app.
      - name: Projection guard
        run: node scripts/check-projection.mjs

      # Every variable the app reads must be in the operator docs and the
      # template. The guard's own tests come first so a broken guard fails here
      # rather than silently passing on a scan that found nothing (#47).
      - name: Env docs guard tests
        run: node --test scripts/check-env-docs.test.mjs

      - name: Env docs guard
        run: node scripts/check-env-docs.mjs
