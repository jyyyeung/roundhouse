# Roundhouse behind nginx with a certificate you already have (issue #47).
#
# Use this when something else — certbot, a corporate wildcard, Cloudflare
# origin certs — already produces the certificate and you want nginx in front.
# If you would rather have the certificate obtained for you, use the Caddyfile
# in this directory instead; it is one file and no renewals.
#
#   1. replace table.example.com everywhere
#   2. point ssl_certificate / ssl_certificate_key at your files
#   3. include it from the http{} block of nginx.conf (drop it in conf.d/ and it
#      is picked up automatically), on the same Docker network as the stack
#   4. set BETTER_AUTH_URL and PUBLIC_WEB_URL to https://<hostname> in .env and
#      restart: cookies are scoped to the origin and mail links come from
#      PUBLIC_WEB_URL
#
# The proxy target is the web container, not the API: it serves the SPA and
# already forwards /api, /ws, /health and /ready to the server, so there is one
# rule to keep right instead of a file tree.
#
# Validated in CI with `nginx -t` by scripts/check-deploy-samples.sh.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

upstream roundhouse_web {
	server web:80;
}

server {
	listen 80;
	listen [::]:80;
	server_name table.example.com;

	# Keep the ACME challenge reachable on plain HTTP; redirect the rest.
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name table.example.com;

	ssl_certificate     /etc/letsencrypt/live/table.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/table.example.com/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 1d;

	# 10 MB is well above the 64 KB frame cap the server enforces; a bigger body
	# never reaches the WebSocket layer.
	client_max_body_size 10m;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# WebSocket upgrade. Without the two headers below /ws answers 400 and the
	# table never loads; `$connection_upgrade` is empty for ordinary requests.
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;

	# Overwrite, never append: the API trusts this header when TRUST_PROXY=true
	# and a client-supplied value would let anyone forge their rate-limit bucket.
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Host $host;

	location / {
		proxy_pass http://roundhouse_web;
		proxy_read_timeout 60s;
	}

	location = /ws {
		proxy_pass http://roundhouse_web;
		# A table can sit idle for a long time between moves.
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_buffering off;
	}

	# Operators monitor these from outside the box; both are answered by the API.
	location = /health {
		proxy_pass http://roundhouse_web;
		access_log off;
	}

	location = /ready {
		proxy_pass http://roundhouse_web;
		access_log off;
	}
}
